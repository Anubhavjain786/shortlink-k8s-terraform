# Local cluster: one control-plane node and two workers.
# Host port 8080 maps to NodePort 30080, where the shortlink Service listens.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: shortlink
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
  - role: worker
  - role: worker
