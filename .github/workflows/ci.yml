name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: python -m pytest -q

  infra:
    name: Validate Terraform and Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: azure/setup-helm@v4
      - run: terraform fmt -check -recursive infra
      - name: Validate local environment
        run: |
          terraform -chdir=infra/local init -backend=false -input=false
          terraform -chdir=infra/local validate
      - name: Validate AWS environment
        run: |
          terraform -chdir=infra/aws init -backend=false -input=false
          terraform -chdir=infra/aws validate
      - name: Lint and render the chart
        run: |
          helm lint deploy/helm/shortlink
          helm template shortlink deploy/helm/shortlink --set ingress.enabled=true > /tmp/rendered.yaml
      - name: Validate rendered manifests against the Kubernetes schema
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz -C /tmp
          /tmp/kubeconform -strict -summary /tmp/rendered.yaml

  e2e:
    name: Deploy to kind and smoke test
    runs-on: ubuntu-latest
    needs: [test, infra]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: helm/kind-action@v1
        with:
          cluster_name: shortlink
          config: kind/cluster.yaml
      - run: make load deploy
      - run: make smoke
      - if: always()
        run: make status
