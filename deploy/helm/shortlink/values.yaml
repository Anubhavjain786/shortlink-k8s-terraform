image:
  repository: shortlink
  tag: dev
  pullPolicy: IfNotPresent

# Used only when autoscaling.enabled is false.
replicaCount: 2

# Redis connection string, passed to the app as SHORTLINK_REDIS_URL.
redisUrl: redis://redis:6379/0
# Public base URL used when building short links. Empty means "use the request URL".
baseUrl: ""

service:
  type: ClusterIP # ClusterIP | NodePort | LoadBalancer
  port: 80
  nodePort: null # set when type is NodePort

# Requests drive scheduling and the autoscaler: CPU utilisation is measured
# against the request, so a request that is too small makes startup look like load.
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

ingress:
  enabled: false
  className: ""
  host: shortlink.local
  annotations: {}

serviceAccount:
  create: true
  annotations: {}
